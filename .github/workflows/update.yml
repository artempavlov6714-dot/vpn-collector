name: Сбор и проверка VPN-ключей

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Проверка репозитория
        uses: actions/checkout@v4
      
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Установка зависимостей
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Запуск сборщика
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python collector.py
      
      - name: Проверка результатов
        run: |
          if [ -f "configs/configs_all.txt" ]; then
            echo "✅ Файл создан: $(wc -l < configs/configs_all.txt) строк"
          else
            echo "⚠️ Файл configs_all.txt не найден"
          fi
